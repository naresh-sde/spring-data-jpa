spring.application.name=jpa-demo
server.port=8080

# ===== H2 (in-memory) database =====
spring.datasource.url=jdbc:h2:mem:jpadb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA / Hibernate =====
# schema is owned by src/main/resources/schema.sql (see README "Database Schema")
spring.jpa.hibernate.ddl-auto=none
# run schema.sql + data.sql AFTER Hibernate starts, so ddl-auto=none stays honest
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.com.naresh.jpa=DEBUG